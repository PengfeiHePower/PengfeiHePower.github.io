<!-- _includes/projects.html -->
<a class="project-card" href="{% if project.redirect %}{{ project.redirect }}{% else %}{{ project.url | relative_url }}{% endif %}">
  {%- if project.img %}
  <div class="project-card-cover">
    <img src="{{ project.img | relative_url }}" alt="{{ project.title }}" loading="lazy">
  </div>
  {%- endif %}
  <div class="project-card-body">
    {%- if project.venue %}<div class="project-card-meta">{{ project.venue }}</div>{% endif %}
    <h3 class="project-card-title">{{ project.title }}</h3>
    <p class="project-card-text">{{ project.description }}</p>
    {%- if project.topics %}
    <div class="project-card-topics">
      {%- for topic in project.topics %}<span>{{ topic }}</span>{% endfor -%}
    </div>
    {%- endif %}
  </div>
</a>
